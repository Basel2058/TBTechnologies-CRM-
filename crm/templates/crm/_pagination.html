{% if page.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2" aria-label="الصفحات">
  <span class="small text-muted">صفحة {{ page.number }} من {{ page.paginator.num_pages }}</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring page=page.previous_page_number %}">السابق</a></li>{% endif %}
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="{% querystring page=page.next_page_number %}">التالي</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
